[package]
name = "shiftdrop"
version = "0.4.3"
edition = "2021"
description = "Shift + arrastar um arquivo para converter localmente (Windows, macOS, Linux)"
authors = ["Vitor de Oliveira"]
license = "MIT"

[lib]
name = "shiftdrop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
ureq = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }

[target.'cfg(not(windows))'.dependencies]
device_query = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_System_SystemInformation",
] }
windows-core = "0.62"
# COM/OLE (autoteste de arrastar: IDataObject do Shell + IDropTarget do overlay)
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = 0
incremental = false
