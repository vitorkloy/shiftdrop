<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 460px; height: 460px; overflow: hidden; background: transparent; }
      #s {
        position: absolute; left: 40px; top: 40px; width: 380px; height: 380px; border-radius: 50%;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38), 0 3px 10px rgba(0, 0, 0, 0.22);
        opacity: 0;
      }
      #s.in { animation: fade 150ms ease-out forwards; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="s"></div>
    <script>
      const s = document.getElementById("s");
      window.__TAURI__.event.listen("radial-show", () => {
        s.classList.remove("in"); void s.offsetWidth; s.classList.add("in");
      });
    </script>
  </body>
</html>
