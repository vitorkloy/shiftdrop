<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B3A66" flood-opacity="0.22" />
    </filter>
    <filter id="lens-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0B3A66" flood-opacity="0.3" />
    </filter>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3EB6F5" />
      <stop offset="100%" stop-color="#1B8EE3" />
    </linearGradient>
    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FD6FB" />
      <stop offset="100%" stop-color="#2AA0EC" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E4E8ED" />
      <stop offset="100%" stop-color="#B9C0C9" />
    </linearGradient>
    <radialGradient id="lens-grad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#2E8CFF" />
      <stop offset="60%" stop-color="#0A63D6" />
      <stop offset="100%" stop-color="#0749A8" />
    </radialGradient>
  </defs>

  <!-- Ficheiro / documento com canto dobrado -->
  <g filter="url(#soft-shadow)">
    <path d="M 120.0 128.0 Q 120.0 112.0 135.7 109.0 L 242.0 88.4 L 296.0 140.0 L 296.0 414.0 Q 296.0 430.0 280.2 427.5 L 135.8 404.5 Q 120.0 402.0 120.0 386.0 Z" fill="url(#panel-grad)" />
    <path d="M 242.0 88.4 L 296.0 140.0 L 251.0 138.3 Q 242.0 138.0 242.0 129.0 Z" fill="url(#fold-grad)" />
  </g>

  <!-- Selo circular -->
  <g filter="url(#lens-shadow)">
    <circle cx="302" cy="300" r="88" fill="url(#ring-grad)" />
  </g>
  <circle cx="302" cy="300" r="68" fill="#C9D1DA" opacity="0.55" />
  <circle cx="302" cy="300" r="62" fill="url(#lens-grad)" />

  <!-- Simbolo de sincronizacao -->
  <g transform="translate(302, 300)" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <path d="M -22.66 -10.57 A 25 25 0 0 1 21.65 -12.50" fill="none" />
      <path d="M 30.74 -17.75 L 28.15 -1.24 L 12.56 -7.25 Z" fill="#FFFFFF" stroke-width="3" />
    </g>
    <g transform="rotate(180)">
      <path d="M -22.66 -10.57 A 25 25 0 0 1 21.65 -12.50" fill="none" />
      <path d="M 30.74 -17.75 L 28.15 -1.24 L 12.56 -7.25 Z" fill="#FFFFFF" stroke-width="3" />
    </g>
  </g>
</svg>
