  </defs>
  <rect width="512" height="512" fill="#262626" />
  <g transform="translate(20, 0)">
    <path d="M 175 120 L 285 85 Q 295 82, 295 95 L 295 415 Q 295 428, 285 425 L 175 390 Q 165 386, 165 373 L 165 137 Q 165 124, 175 120 Z" fill="url(#blue-panel-grad)" filter="url(#panel-shadow)" />
    <path d="M 175 120 L 285 85" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    <g filter="url(#badge-shadow)">
      <circle cx="320" cy="275" r="82" fill="url(#ring-grad)" />
      <circle cx="320" cy="275" r="62" fill="url(#core-grad)" />
      <g transform="translate(320, 275)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <g>
          <path d="M -20.78 -12.00 A 24 24 0 0 1 22.55 -8.21" />
          <path d="M 25.94 -21.79 L 22.55 -8.21 L 11.23 -16.44" />
