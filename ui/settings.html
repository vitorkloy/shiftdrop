<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>ShiftDrop — Configurações</title>
<link rel="icon" href="logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="brand.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); color: var(--text); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .brand img { width: 36px; height: 36px; border-radius: 8px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .ver { margin: 1px 0 0; font-size: 12px; opacity: .55; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 12px; }
  select, input[type=range] { accent-color: var(--accent); }
  select { min-width: 110px; padding: 4px 6px; border-radius: 6px; background: var(--surface); color: var(--text); border: 1px solid var(--surface-2); }
  .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  #avail { margin-top: 14px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 16%, transparent); }
  #avail[hidden] { display: none; }
  #avail-msg { font-size: 13px; font-weight: 600; }
  #go-upd, #save, #access-btn { border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
  #go-upd, #access-btn { background: var(--accent); color: var(--icon); padding: 6px 12px; white-space: nowrap; }
  #access { align-items: flex-start; }
  #access-msg { font-size: 13px; line-height: 1.35; }
  #go-upd:disabled { opacity: .55; cursor: default; }
  #save { background: var(--accent); color: var(--icon); padding: 7px 18px; min-width: 108px; transition: background-color .18s ease; }
  #save:disabled { cursor: default; }
  #save.is-saved { background: var(--core-1); animation: save-ack .4s ease; }
  @keyframes save-ack { 0% { transform: scale(.96); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  #msg { font-size: 12px; opacity: .8; }
  hr { border: 0; border-top: 1px solid var(--surface-2); margin: 12px 0; }
</style>
</head>
<body>
<div class="brand"><img src="logo.svg" alt="" width="36" height="36" /><div><h1>ShiftDrop</h1><p class="ver" id="ver"></p></div></div>
<div class="row"><label for="k0">Converter formatos</label><select id="k0"></select></div>
<div class="row"><label for="k1">Ferramentas</label><select id="k1"></select></div>
<div class="row"><label for="k2">Ações de arquivo</label><select id="k2"></select></div>
<hr />
<div class="row"><label for="scale">Tamanho da roda</label><input id="scale" type="range" min="0.5" max="1.5" step="0.05" /><span class="val" id="sv"></span></div>
<div class="row"><label for="auto">Iniciar com o sistema</label><input id="auto" type="checkbox" /></div>
<div class="row"><label for="upd">Avisar quando houver atualização</label><input id="upd" type="checkbox" /></div>
<div class="row" id="avail" hidden>
  <span id="avail-msg">Nova versão disponível</span>
  <button id="go-upd" type="button">Atualizar</button>
</div>
<div class="row" id="access" hidden>
  <span id="access-msg">Para a roda abrir ao arrastar, permita Acessibilidade para o ShiftDrop.</span>
  <button id="access-btn" type="button">Abrir Ajustes</button>
</div>
<div class="foot"><span id="msg"></span><button id="save">Salvar</button></div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const K = [["shift", "Shift"], ["ctrl", navigator.platform.startsWith("Mac") ? "Ctrl / ⌘" : "Ctrl"], ["alt", navigator.platform.startsWith("Mac") ? "Option" : "Alt"]];
  const $ = (id) => document.getElementById(id);
  for (let i = 0; i < 3; i++) for (const [v, t] of K) $("k" + i).add(new Option(t, v));
  let cfg;
  const pct = () => ($("sv").textContent = Math.round($("scale").value * 100) + "%");
  $("scale").oninput = pct;
  invoke("app_version").then((v) => { $("ver").textContent = "versão " + v; });
  invoke("pending_update").then((p) => {
    if (!p) return;
    $("avail").hidden = false;
    $("avail-msg").textContent = "Nova versão " + p.version + " disponível";
    $("go-upd").textContent = p.can_install ? "Atualizar" : "Abrir no GitHub";
    $("go-upd").onclick = async () => {
      $("go-upd").disabled = true;
      $("avail-msg").textContent = p.can_install ? "Baixando…" : "Nova versão " + p.version + " disponível";
      try {
        if (p.can_install) await invoke("install_update");
        else await invoke("open_release_page");
      } catch (e) {
        $("avail-msg").textContent = String(e);
        $("go-upd").disabled = false;
      }
    };
  });
  invoke("accessibility_status").then((ok) => {
    if (ok === false) $("access").hidden = false;
  });
  $("access-btn").onclick = () => invoke("open_accessibility_settings");
  invoke("get_config").then((c) => {
    cfg = c;
    c.keys.forEach((k, i) => ($("k" + i).value = k));
    $("scale").value = c.scale; $("auto").checked = c.autostart; $("upd").checked = !!c.notify_updates; pct();
  });
  let saveTimer;
  $("save").onclick = async () => {
    const btn = $("save");
    if (btn.disabled) return;
    btn.disabled = true;
    $("msg").textContent = "";
    const c = { ...cfg, keys: [0, 1, 2].map((i) => $("k" + i).value), scale: +$("scale").value, autostart: $("auto").checked, notify_updates: $("upd").checked };
    try {
      cfg = await invoke("set_config", { cfg: c });
      btn.classList.remove("is-saved");
      void btn.offsetWidth;
      btn.textContent = "Salvo ✓";
      btn.classList.add("is-saved");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        btn.classList.remove("is-saved");
        btn.textContent = "Salvar";
        btn.disabled = false;
      }, 1100);
    } catch (e) {
      clearTimeout(saveTimer);
      btn.classList.remove("is-saved");
      btn.textContent = "Salvar";
      btn.disabled = false;
      $("msg").textContent = String(e);
    }
  };
</script>
</body>
</html>
