<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>ShiftDrop — Configurações</title>
<link rel="icon" href="logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="brand.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--surface); color: var(--text); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .brand img { width: 36px; height: 36px; border-radius: 8px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; gap: 12px; }
  select, input[type=range] { accent-color: var(--accent); }
  select { min-width: 110px; padding: 4px 6px; border-radius: 6px; background: var(--surface); color: var(--text); border: 1px solid var(--surface-2); }
  .val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  button { background: var(--accent); color: var(--icon); border: 0; border-radius: 6px; padding: 7px 18px; font: inherit; cursor: pointer; }
  #msg { font-size: 12px; opacity: .8; }
  hr { border: 0; border-top: 1px solid var(--surface-2); margin: 12px 0; }
</style>
</head>
<body>
<div class="brand"><img src="logo.svg" alt="" width="36" height="36" /><h1>ShiftDrop</h1></div>
<div class="row"><label for="k0">Converter formatos</label><select id="k0"></select></div>
<div class="row"><label for="k1">Ferramentas</label><select id="k1"></select></div>
<div class="row"><label for="k2">Ações de arquivo</label><select id="k2"></select></div>
<hr />
<div class="row"><label for="scale">Tamanho da roda</label><input id="scale" type="range" min="0.5" max="1.5" step="0.05" /><span class="val" id="sv"></span></div>
<div class="row"><label for="auto">Iniciar com o sistema</label><input id="auto" type="checkbox" /></div>
<div class="row"><label for="upd">Avisar quando houver atualização</label><input id="upd" type="checkbox" /></div>
<div class="foot"><span id="msg"></span><button id="save">Salvar</button></div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const K = [["shift", "Shift"], ["ctrl", navigator.platform.startsWith("Mac") ? "Ctrl / ⌘" : "Ctrl"], ["alt", navigator.platform.startsWith("Mac") ? "Option" : "Alt"]];
  const $ = (id) => document.getElementById(id);
  for (let i = 0; i < 3; i++) for (const [v, t] of K) $("k" + i).add(new Option(t, v));
  let cfg;
  const pct = () => ($("sv").textContent = Math.round($("scale").value * 100) + "%");
  $("scale").oninput = pct;
  invoke("get_config").then((c) => {
    cfg = c;
    c.keys.forEach((k, i) => ($("k" + i).value = k));
    $("scale").value = c.scale; $("auto").checked = c.autostart; $("upd").checked = !!c.notify_updates; pct();
  });
  $("save").onclick = async () => {
    const c = { ...cfg, keys: [0, 1, 2].map((i) => $("k" + i).value), scale: +$("scale").value, autostart: $("auto").checked, notify_updates: $("upd").checked };
    try { cfg = await invoke("set_config", { cfg: c }); $("msg").textContent = "Salvo."; }
    catch (e) { $("msg").textContent = String(e); }
  };
</script>
</body>
</html>
