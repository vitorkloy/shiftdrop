<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>ShiftDrop</title>
<style>
  :root { color-scheme: light dark; --accent: #ff5500; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  body { margin: 0; padding: 18px 20px; background: Canvas; color: CanvasText; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0 0 16px; line-height: 1.45; opacity: .9; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; }
  button { border: 0; border-radius: 6px; padding: 7px 16px; font: inherit; cursor: pointer; }
  #yes { background: var(--accent); color: white; }
  #no { background: color-mix(in srgb, CanvasText 12%, Canvas); color: CanvasText; }
</style>
</head>
<body>
<h1>Avisar atualizações?</h1>
<p>Quando sair uma versão nova no GitHub, o ShiftDrop pode mandar uma notificação. Dá para mudar depois em Configurações.</p>
<div class="foot">
  <button id="no" type="button">Agora não</button>
  <button id="yes" type="button">Sim, avisar</button>
</div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  invoke("accent_color").then((c) => c && document.documentElement.style.setProperty("--accent", c)).catch(() => {});
  const pick = (enabled) => invoke("set_notify_updates", { enabled }).catch(() => {});
  document.getElementById("yes").onclick = () => pick(true);
  document.getElementById("no").onclick = () => pick(false);
</script>
</body>
</html>
